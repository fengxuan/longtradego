name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ARCH="${{ matrix.arch }}"
          BIN_DIR="dist/longtradego_${VERSION}_darwin_${ARCH}"
          BIN_PATH="${BIN_DIR}/longtradego"
          mkdir -p "${BIN_DIR}"
          GOOS=darwin GOARCH="${ARCH}" CGO_ENABLED=0 \
            go build -trimpath \
            -ldflags "-s -w -X longtradego/internal/service.buildVersion=${TAG} -X longtradego/internal/service.buildCommit=${GITHUB_SHA} -X longtradego/internal/service.buildDate=${BUILD_DATE}" \
            -o "${BIN_PATH}" .
          tar -C "dist" -czf "dist/longtradego_${VERSION}_darwin_${ARCH}.tar.gz" "longtradego_${VERSION}_darwin_${ARCH}"
          rm -rf "${BIN_DIR}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: longtradego-darwin-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-artifact
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: longtradego-darwin-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum longtradego_*.tar.gz > checksums.txt)

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/longtradego_*.tar.gz
            dist/checksums.txt
